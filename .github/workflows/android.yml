name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GODOT_VERSION: "4.0"
      GODOT_RELEASE: "4.0-stable"
      ANDROID_BUILD_TOOLS: "33.0.2"
      ANDROID_PLATFORM: "android-33"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}"

      - name: Set up Java 11 for Godot 4.0
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Godot and export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" "$HOME/.local/bin/godot"
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          "$HOME/.local/bin/godot" --version

      - name: Create temporary debug keystore
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore release keystore from Secrets
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured."
          }
          [IO.File]::WriteAllBytes(
            (Join-Path $env:RUNNER_TEMP "release.keystore"),
            [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          )

      - name: Configure Godot Android export
        shell: pwsh
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          function Escape-GodotString([string]$Value) {
            return $Value.Replace('\', '\\').Replace('"', '\"')
          }

          $settingsDirectory = Join-Path $HOME ".config/godot"
          New-Item -ItemType Directory -Force -Path $settingsDirectory | Out-Null
          $sdk = Escape-GodotString $env:ANDROID_SDK_ROOT
          $debugKey = Escape-GodotString (Join-Path $env:RUNNER_TEMP "debug.keystore")
          $lines = @(
            '[gd_resource type="EditorSettings" format=3]',
            '',
            '[resource]',
            "export/android/android_sdk_path = `"$sdk`""
          )

          if ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            if ([string]::IsNullOrWhiteSpace($env:RELEASE_KEY_ALIAS) -or
                [string]::IsNullOrWhiteSpace($env:RELEASE_KEY_PASSWORD)) {
              throw "Release signing Secrets are not configured."
            }
            $releaseKey = Escape-GodotString (Join-Path $env:RUNNER_TEMP "release.keystore")
            $alias = Escape-GodotString $env:RELEASE_KEY_ALIAS
            $password = Escape-GodotString $env:RELEASE_KEY_PASSWORD
            $lines += "export/android/release_keystore = `"$releaseKey`""
            $lines += "export/android/release_keystore_user = `"$alias`""
            $lines += "export/android/release_keystore_pass = `"$password`""
          } else {
            $lines += "export/android/debug_keystore = `"$debugKey`""
            $lines += 'export/android/debug_keystore_user = "androiddebugkey"'
            $lines += 'export/android/debug_keystore_pass = "android"'
          }

          Set-Content -LiteralPath (Join-Path $settingsDirectory "editor_settings-4.tres") -Value $lines

      - name: Compute APK name
        id: apk
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          build_date="${built_at%%T*}"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "name=badland-${GITHUB_REF_NAME}.apk" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "name=badland-dev-${build_date}-${short_sha}.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Set development version metadata
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $presetPath = Join-Path $env:GITHUB_WORKSPACE "export_presets.cfg"
          $content = Get-Content -LiteralPath $presetPath -Raw
          if ($content -notmatch '(?m)^version/name="([^"]+)"$') {
            throw "Android version/name was not found in export_presets.cfg."
          }
          $baseVersion = $Matches[1] -replace '-dev\+.*$', ''
          $developmentVersion = "$baseVersion-dev+${{ steps.apk.outputs.short_sha }}"
          $content = $content -replace '(?m)^version/name="[^"]+"$', "version/name=`"$developmentVersion`""
          Set-Content -LiteralPath $presetPath -Value $content -NoNewline
          Write-Host "Development versionName: $developmentVersion"

      - name: Validate project and build Android APK
        shell: pwsh
        run: ./scripts/build_android.ps1 -Godot "$HOME/.local/bin/godot" -Mode "${{ steps.apk.outputs.mode }}" -Output "build/${{ steps.apk.outputs.name }}"

      - name: Upload development APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ github.sha }}
          path: build/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      - name: Update latest development prerelease
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: build/${{ steps.apk.outputs.name }}
          BUILT_AT: ${{ steps.apk.outputs.built_at }}
          SHORT_SHA: ${{ steps.apk.outputs.short_sha }}
        run: |
          set -euo pipefail

          git tag --force dev-latest "$GITHUB_SHA"
          git push --force origin refs/tags/dev-latest

          notes_file="$RUNNER_TEMP/dev-release-notes.md"
          printf '%s\n\n' 'Automatically updated development build.' > "$notes_file"
          printf -- '- Build time (UTC): `%s`\n' "$BUILT_AT" >> "$notes_file"
          printf -- '- Commit: [`%s`](%s/commit/%s)\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$notes_file"
          printf -- '- Short SHA: `%s`\n' "$SHORT_SHA" >> "$notes_file"
          printf -- '- Branch: `%s`\n' "$GITHUB_REF_NAME" >> "$notes_file"

          if gh release view dev-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              if [[ -n "$asset" ]]; then
                gh release delete-asset dev-latest "$asset" --yes --repo "$GITHUB_REPOSITORY"
              fi
            done < <(gh release view dev-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release edit dev-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest Development Build" \
              --notes-file "$notes_file" \
              --prerelease
          else
            gh release create dev-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest Development Build" \
              --notes-file "$notes_file" \
              --prerelease \
              --latest=false \
              --target "$GITHUB_SHA"
          fi

          gh release upload dev-latest "$APK_PATH" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          files: build/${{ steps.apk.outputs.name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
